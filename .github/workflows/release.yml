name: Signed Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  QT_QPA_PLATFORM: "offscreen"
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  windows-release:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches project version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:RELEASE_TAG"
          }
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:RELEASE_TAG.Substring(1) -ne $projectVersion) {
            throw "Release tag $env:RELEASE_TAG does not match project version $projectVersion"
          }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: pyinstaller --clean --noconfirm packaging/photosage-cli.spec
      - run: pyinstaller --clean --noconfirm packaging/photosage-gui.spec
      - name: Sign and verify executables
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE -or -not $env:SIGNING_PASSWORD) {
            throw 'Windows signing secrets are required for release builds.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'photosage-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:SIGNING_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          )
          foreach ($path in @('dist/PhotoSage.exe', 'dist/PhotoSage-GUI.exe')) {
            $signature = Set-AuthenticodeSignature -FilePath $path -Certificate $certificate -TimestampServer 'http://timestamp.digicert.com'
            if ($signature.Status -ne 'Valid') { throw "Authenticode signing failed for $path: $($signature.StatusMessage)" }
          }
          Remove-Item -LiteralPath $pfxPath -Force
      - name: Smoke test signed CLI
        shell: pwsh
        run: |
          & .\dist\PhotoSage.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Signed CLI smoke test failed.' }
      - name: Generate SBOM and release archive
        shell: pwsh
        run: |
          cyclonedx-py environment --output-reproducible --output-format JSON --output-file dist/photosage-sbom.json
          New-Item -ItemType Directory -Path dist/release | Out-Null
          Copy-Item dist/PhotoSage.exe,dist/PhotoSage-GUI.exe,dist/photosage-sbom.json,README.md,LICENSE -Destination dist/release
          Copy-Item integrations -Destination dist/release/integrations -Recurse
          Copy-Item docs/catalog-integrations.md -Destination dist/release
          Compress-Archive -Path dist/release/* -DestinationPath dist/PhotoSage-Windows.zip
          Get-FileHash -Algorithm SHA256 dist/PhotoSage-Windows.zip | ForEach-Object { "$($_.Hash.ToLower())  PhotoSage-Windows.zip" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/PhotoSage-Windows.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhotoSage-Windows
          path: |
            dist/PhotoSage-Windows.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" dist/PhotoSage-Windows.zip dist/SHA256SUMS.txt --verify-tag --generate-notes
