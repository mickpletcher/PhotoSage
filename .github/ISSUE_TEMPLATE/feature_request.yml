name: Feature request
description: Propose a focused PhotoSage improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need and how the proposal preserves PhotoSage's preview-first, no-overwrite, local-first safety model.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is difficult today, and who would benefit?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution, including CLI or GUI behavior where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy impact
      description: Explain effects on local files, metadata, AI providers, network traffic, manifests, undo, and recovery.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require PhotoSage to delete or overwrite source media.
          required: true
        - label: Any cloud processing in this proposal remains explicit and opt-in.
          required: true
